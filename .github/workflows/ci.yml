name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: docker compose version

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Unit and integration tests
        run: make test

      - name: E2E tests
        run: make e2e
