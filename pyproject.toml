[project]
name = "payment-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.0,<0.144.0",
    "faststream[rabbit]>=0.7.7,<0.8",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.0,<3",
    "sqlalchemy[asyncio]>=2.1.4,<2.2",
    "asyncpg>=0.32.0,<0.33",
    "alembic>=1.20.0,<2",
    "httpx>=0.28.1,<0.29",
    "structlog>=25,<26",
    "uvicorn[standard]>=0.54.0,<0.55",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.14.0,<0.15",
    "mypy>=1.20,<2",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F401"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["unit", "integration", "e2e"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["payment_service"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == \"__main__\":",
]
